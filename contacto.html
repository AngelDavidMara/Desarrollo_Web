<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Cafetería</title>
    <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcf8f5; 
            color: #4a3b32;
        }

        
        header {
            background-color: #3e2723;
            padding: 15px;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: #d7ccc8;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #ffffff;
        }

        nav a.active {
            color: #ffffff;
            border-bottom: 2px solid #ffffff;
        }

        
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
            display: grid;
            grid-template-columns: 1fr 1fr;
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }

        
        .info-section {
            background-color: #3e2723; 
            color: #ffffff;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .info-section h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #ffffff;
        }

        .details {
            margin-bottom: 30px;
        }

        .details p {
            margin: 15px 0;
            display: flex;
            align-items: center;
            font-size: 16px;
            color: #d7ccc8;
        }

        .details strong {
            color: #ffffff;
            margin-right: 5px;
        }

        .social-media a {
            color: #d7ccc8;
            text-decoration: none;
            margin-right: 15px;
            font-weight: bold;
            transition: color 0.3s;
        }

        .social-media a:hover {
            color: #ffffff;
        }

        
        .form-section {
            padding: 40px;
            background-color: #ffffff;
        }

        .form-section h2 {
            margin-bottom: 20px;
            color: #3e2723;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left; 
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #4a3b32;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d7ccc8;
            border-radius: 6px;
            font-size: 16px;
            background-color: #faf6f3;
            color: #4a3b32;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #6f4e37; 
            outline: none;
            background-color: #ffffff;
        }

        .form-group textarea {
            height: 120px;
            resize: vertical;
        }

        
        .submit-btn {
            background-color: #6f4e37; 
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #4a3321;
        }

        
        @media (max-width: 768px) {
            main {
                padding: 30px 15px;
            }
            .container {
                grid-template-columns: 1fr;
            }
            .info-section {
                order: 2;
                padding: 30px;
            }
            .form-section {
                order: 1;
                padding: 30px;
            }
        }

        
        footer {
            background-color: #a67b5b;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="menu.html">Menú</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="info-section">
                <div>
                    <h2>Información de Contacto</h2>
                    <div class="details">
                        <p><strong>Dirección:</strong> Bo. San Francisco, Comayagua, Honduras</p>
                        <p><strong>Teléfono:</strong> +123 456 7890</p>
                        <p><strong>Email:</strong> contacto@ejemplo.com</p>
                    </div>
                </div>
                
                <div class="social-media">
                    <a href="https://facebook.com" target="_blank">Facebook</a>
                    <a href="https://twitter.com" target="_blank">X (Twitter)</a>
                    <a href="https://instagram.com" target="_blank">Instagram</a>
                </div>
            </div>

            <div class="form-section">
                <h2>Envíanos un mensaje</h2>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo Electrónico</label>
                        <input type="email" id="correo" name="correo" required>
                    </div>

                    <div class="form-group">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Enviar Mensaje</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy;2026 Cafetería "Byte & Coffee". Hecho con amor y cafeína.</p>
    </footer>

</body>
</html>
